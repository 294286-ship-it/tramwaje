<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d21;--ink:#e8e8e8;--muted:#6b6f76;--panel:#24272c;--line:#363a41;--hl:#2f3540;--water:#22384a;--park:#24372a;--river:#2a4a63}}
:root[data-theme="dark"]{--bg:#1b1d21;--ink:#e8e8e8;--muted:#6b6f76;--panel:#24272c;--line:#363a41;--hl:#2f3540;--water:#22384a;--park:#24372a;--river:#2a4a63}
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}

#app{display:flex;height:100%}#panel{width:272px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:10px;min-height:0}
h1{font-size:15px;margin:0;line-height:1.25}#tiles{display:flex;gap:8px}

.tile.on{border-color:var(--ink);background:var(--hl)}.tile svg{width:100%;height:54px}
#reset{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px;font:inherit;cursor:pointer}

.row.on{background:var(--hl)}.has .row:not(.on){opacity:.55}.badge{min-width:36px;text-align:center;font-weight:700;border-radius:6px;padding:3px 0}.dir{font-size:12.5px;line-height:1.2}
#map,#list{user-select:none;-webkit-user-select:none}#map{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}svg#sv{width:100%;flex:1;min-height:0;display:block;touch-action:none;cursor:grab}
.line path.v{fill:none;stroke-width:1.1;stroke-linejoin:round;stroke-linecap:butt}.line path.h{fill:none;stroke:transparent;stroke-width:3.2;pointer-events:stroke}
.sel .line:not(.on) path.v{opacity:.55;filter:grayscale(1)}.node path{stroke-linejoin:round;stroke-linecap:round}.sel .node.off{opacity:.3}
text{font-family:Arial,"Liberation Sans","Helvetica Neue",Helvetica,sans-serif;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;fill:var(--ink);pointer-events:none}
#dock{display:none;background:var(--panel);border-top:1px solid var(--line);max-height:55%;overflow:auto;padding:4px 10px 8px}#dock.on{display:block}#st text{stroke:none;pointer-events:auto}.hd{font-weight:600;font-size:12.5px;margin:6px 0 0}.sw{overflow-x:auto}
#pop{position:absolute;display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 4px 16px #0005;max-width:250px;transform:translate(-50%,-100%);z-index:5}#pop b{display:block;margin-bottom:4px}.bd{display:inline-block;margin:2px;cursor:pointer;padding:2px 8px;min-width:32px;text-align:center;font-weight:700;border-radius:6px}.node{cursor:pointer}
@media (max-width:700px){#dock{max-height:36vh}#app{flex-direction:column}#panel{width:100%;max-height:44%;border-right:0;border-bottom:1px solid var(--line)}.tile svg{display:none}}
#dl{border:1px solid var(--line);border-radius:8px;padding:6px 8px}#dl summary{cursor:pointer;font-weight:600;font-size:13px}.dlb{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dlb button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}.dlb button:disabled{opacity:.5;cursor:default}
.dlb label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}.dlb select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px;font:inherit;font-size:12.5px}#dlst{font-size:12px;color:var(--muted);min-height:1.2em;word-break:break-all}
#lvrow{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}#lvrow[hidden]{display:none}#lvrow label{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}#lvst{font-size:12px;color:var(--muted);margin-top:4px;min-height:1.2em}.rd{transition:transform 9.5s linear}
